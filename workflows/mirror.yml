name: Mirror to Codeberg

on:
  push:
    branches:
      - pages
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: cssnr/mirror-repository-action@v1
        with:
          host: https://codeberg.org
          username: Rykerling
          password: ${{ secrets.CODEBERG_TOKEN }}